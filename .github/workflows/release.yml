name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install prerequisites
        run: uv sync

      - name: Get Version
        id: version
        run: |
          echo "VERSION=$(uv tree -d0 | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+')" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check Version
        if: steps.version.outputs.VERSION != steps.version.outputs.TAG_VERSION
        run: exit 1

      - name: Build
        run: uv build

      - name: Pack character resources
        run: |
          mkdir -p release-assets
          archive="manosaba-prefabs-${{ steps.version.outputs.VERSION }}.tar.gz"
          tar --exclude='.DS_Store' \
            -C nonebot_plugin_manosaba_memes/assets \
            -czf "release-assets/${archive}" prefabs
          cd release-assets
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create GitHub Release
        run: >-
          gh release view ${{ steps.version.outputs.TAG_NAME }} >/dev/null 2>&1 ||
          gh release create ${{ steps.version.outputs.TAG_NAME }}
          --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        run: >-
          gh release upload --clobber
          ${{ steps.version.outputs.TAG_NAME }}
          dist/*.tar.gz dist/*.whl release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
